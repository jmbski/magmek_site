[program:sl_api]
command = /home/magmek/.cache/pypoetry/virtualenvs/magmek-backend-ltLPWtng-py3.12/bin/magmek-sl-api 
directory = /var/www/magmek_backend
environment = SL_SHARED_SECRET=%(SL_SHARED_SECRET),SL_AUTH_TS_SKEW_SECONDS=%(SL_AUTH_TS_SKEW_SECONDS),SL_AUTH_NONCE_TTL_SECONDS=%(SL_AUTH_NONCE_TTL_SECONDS),SL_LOGIN_CODE_TTL_SECONDS=%(SL_LOGIN_CODE_TTL_SECONDS),REDIS_URL=%(REDIS_URL)
