server {

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.aetherglow-rpg.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.aetherglow-rpg.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    
    server_name www.aetherglow-rpg.com aetherglow-rpg.com;

    root /var/www/aetherglow;
    index index.html index.htm index.nginx-debian.html;

#    location = /radio {
#        return 301 /radio/;
#    }
#
#    location ^~ /radio/ {
#        proxy_pass http://127.0.0.1:8005/;
#        proxy_http_version 1.1;
#        proxy_set_header Host $host;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        
#        proxy_buffering off;
#        proxy_request_buffering off;
#    }

    location /supervisor/ {
        
        
        proxy_pass http://127.0.0.1:9001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_request_buffering off;
    }


    location /api/v1/ {
        # Proxy requests to the BSD gunicorn application running on the 
        # bsd_backend socket
        
        proxy_pass http://unix:/run/gunicorn/magmek_backend.sock;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-NginX-Proxy    true;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Host              $http_host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   X-Forwarded-Prefix /api/v1;
        proxy_redirect     off;
        proxy_http_version 1.1;
        proxy_set_header   Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

}

