server {
    server_name radio.aetherglow-rpg.com;

    location / {
        proxy_pass http://127.0.0.1:8005;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    listen 80;
}

server {
    if ($host = www.aetherglow-rpg.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aetherglow-rpg.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.aetherglow-rpg.com aetherglow-rpg.com;
    return 404; # managed by Certbot

}