server {
    server_name supervisor.aetherglow-rpg.com;


    location / {
        
        proxy_pass http://127.0.0.1:9001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/supervisor.aetherglow-rpg.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/supervisor.aetherglow-rpg.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = supervisor.aetherglow-rpg.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name supervisor.aetherglow-rpg.com;

    listen 80;
    return 404; # managed by Certbot
}