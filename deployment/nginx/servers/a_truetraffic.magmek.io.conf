
server {
    server_name true-traffic.magmek.io;

    root /var/www/truetraffic.io;
    index index.html index.htm index.nginx-debian.html;

    location /api/v1/ {
        # Proxy requests to the BSD gunicorn application running on the 
        # bsd_backend socket
        
        proxy_pass http://unix:/run/gunicorn/sl_traffic.sock;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-NginX-Proxy    true;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Host              $http_host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   X-Forwarded-Prefix /api/v1;
        proxy_redirect     off;
        proxy_http_version 1.1;
        proxy_set_header   Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/true-traffic.magmek.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/true-traffic.magmek.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = true-traffic.magmek.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name true-traffic.magmek.io;

    listen 80;
    return 404; # managed by Certbot


}