
server { 

    server_name language.aetherglow-rpg.com;

    root /var/www/conlang-ui;
    index index.html index.htm index.nginx-debian.html;

    location /services/ {
        
        proxy_pass http://unix:/run/gunicorn/conlang-server.sock;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-NginX-Proxy    true;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Host              $http_host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   X-Forwarded-Prefix /api/v1;
        proxy_redirect     off;
        proxy_http_version 1.1;
        proxy_set_header   Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/language.aetherglow-rpg.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/language.aetherglow-rpg.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = language.aetherglow-rpg.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

 

    server_name language.aetherglow-rpg.com;
    
    listen 80;
    return 404; # managed by Certbot


}