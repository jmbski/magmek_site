server {
    server_name www.magmek.io magmek.io;

    root /var/www/magmek.io;
    index index.html index.htm index.nginx-debian.html;


    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.magmek.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.magmek.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}server {
    if ($host = magmek.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.magmek.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name www.magmek.io magmek.io;

    listen 80;
    return 404; # managed by Certbot




}