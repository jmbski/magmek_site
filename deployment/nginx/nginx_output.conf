server {

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.aetherglow-rpg.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.aetherglow-rpg.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    
    server_name www.aetherglow-rpg.com aetherglow-rpg.com;

    root /var/www/aetherglow;
    index index.html index.htm index.nginx-debian.html;

    include /etc/nginx/custom/a_*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

}
server {
    include /etc/nginx/redirects/a_*.conf;


    listen 80;
    server_name www.aetherglow-rpg.com aetherglow-rpg.com;
    return 404; # managed by Certbot

}
# configuration file /etc/letsencrypt/options-ssl-nginx.conf:
# This file contains important security parameters. If you modify this file
# manually, Certbot will be unable to automatically provide future security
# updates. Instead, Certbot will print and log an error message with a path to
# the up-to-date file that you will need to refer to when manually updating
# this file. Contents are based on https://ssl-config.mozilla.org

ssl_session_cache shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

# configuration file /etc/nginx/custom/a_icecast.nginx.conf:
location = /radio {
    return 301 /radio/;
}

location /radio/ {
    proxy_pass http://127.0.0.1:8005/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_buffering off;
    proxy_request_buffering off;
}
