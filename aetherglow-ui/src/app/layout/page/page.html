    <div class="ag-top-nav shrink-0 h-[15vw] min-h-[120px] max-h-[160px] flex justify-center bg-gray-900 overflow-hidden relative">

        @for(img of images(); track img; let idx = $index) {
            <div class="ag-banner-imgs w-full absolute inset-0 bg-center bg-size-[100%]"
                [ngStyle]="{'background-image': 'url(' + img + ')', opacity: idx === currentIndex() ? '1' : '0'}">
            </div>
        }

        <a href="/home/" class=" max-h-[150px] max-w-[50%]">
            <img class="ag-blue-glow h-full w-full" src="./aetherglow-text-logo2.png">
        </a>

    </div>
    <p-menubar class="rounded-none! justify-center flex" [model]="menuItems()"></p-menubar>
    <!-- Content Area -->
    <div class="ag-content flex-1 overflow-auto justify-center w-full max-h-[80vh]">
        <div class="w-full h-full flex justify-center flex-col items-center p-2">
            <p-toast/>
            <ng-content></ng-content>
        </div>
    </div>
</div>
