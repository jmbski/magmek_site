[project]
name = "magmek_backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Joe",email = "stirgejr@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "jbutils (>=0.2.16,<0.3.0)",
    "gunicorn (<23)",
    "flask (>=3.1.3,<4.0.0)",
    "flask-cors (>=6.0.2,<7.0.0)",
    "argcomplete (>=3.6.3,<4.0.0)",
    "gevent (>=25.9.1,<26.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "flask-restx (>=1.3.2,<2.0.0)",
    "yt-dlp (>=2026.3.3,<2027.0.0)",
    "secretstorage (>=3.5.0,<4.0.0)",
    "redis (>=7.3.0,<8.0.0)",
    "fastapi (>=0.135.2,<0.136.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "geoalchemy2 (>=0.18.4,<0.19.0)",
    "sqlalchemy-timescaledb (>=0.4.1,<0.5.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "shapely (>=2.1.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
magmek-server = "magmek_backend.api:main"
magmek-cli = "magmek_backend.cli.main:main"
sl-traffic = "magmek_backend.traffic.server:main"