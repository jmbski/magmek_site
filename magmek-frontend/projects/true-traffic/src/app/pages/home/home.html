<div class="flex h-full w-full">
    <tt-page-layout class="tt-page">
        <div class="w-full flex justify-center mt-4">
            <p-select [options]="dropdownOptions"
                [(ngModel)]="simName"
                [checkmark]="true"
                optionLabel="name"
                optionValue="value"
                [showClear]="true"
                placeholder="Select a Sim"
                class="w-full md:w-56"
            />
        </div>

        <tt-sim-snapshots [snapshots]="simSnapshots" [simName]="simName"></tt-sim-snapshots>
    </tt-page-layout>

</div>
