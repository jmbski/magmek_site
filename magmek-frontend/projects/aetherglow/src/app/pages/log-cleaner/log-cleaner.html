<ag-page-layout>
    <div [class]="dividerClassFull"></div>
    <p class="text-4xl font-bold">RolePlay Log Cleaner</p>
    <div [class]="dividerClassFull"></div>


    <p-panel class="w-full" [toggleable]="true" toggler="header" >

        <ng-template pTemplate="header">
            <div class="w-full">
                <span class="text-2xl font-bold">Enter RP Chat Log</span>
                <p-menubar [model]="inputMenuModel" class="mt-2"></p-menubar>
            </div>
        </ng-template>

        <textarea #inputTextArea id="inputTextArea"
            pTextarea
            fluid
            [rows]="inputRows"
            [(ngModel)]="inputText">
        </textarea>
    </p-panel>

    <p-panel class="w-full" [toggleable]="true" toggler="header" >

        <ng-template pTemplate="header">
            <div class="w-full">
                <span class="text-2xl font-bold">Output</span>
                <p-menubar [model]="outputMenuModel" class="mt-2"></p-menubar>
            </div>
        </ng-template>

        <textarea #outputTextArea
            pTextarea
            fluid
            [rows]="outputRows"
            [(ngModel)]="outputText"></textarea>
    </p-panel>
</ag-page-layout>
